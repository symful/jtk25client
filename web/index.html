<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jadwal Perkuliahan JTK25 — Lihat jadwal, pengganti, pengumuman, dan kegiatan kampus.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#3B72D9">

  <!--
    AI/Crawler API Reference — fetch structured data from the JSON API:
    GET https://jtk25.my.id/api/v1/schedules        — jadwal kuliah
    GET https://jtk25.my.id/api/v1/pengganti        — jadwal pengganti
    GET https://jtk25.my.id/api/v1/announcements    — pengumuman
    GET https://jtk25.my.id/api/v1/events           — kegiatan kampus
    GET https://jtk25.my.id/api/v1/dosen            — daftar dosen
    GET https://jtk25.my.id/api/v1/rooms            — daftar ruangan
    GET https://jtk25.my.id/api/v1/meta             — metadata (semester, kategori)
    No authentication required. All responses are JSON.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JTK25 Jadwal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JTK25 Jadwal</title>
  <link rel="manifest" href="manifest.json">

  <!-- Brand splash — pure CSS, no frameworks; auto-removed on flutter-first-frame -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #3B72D9; font-family: system-ui, -apple-system, sans-serif; }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: #3B72D9;
      color: #FFFFFF;
      user-select: none;
    }
    #loading-splash .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    #loading-splash .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
    }
    #loading-splash .brand-text {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    #loading-splash .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-splash .status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <!-- Brand splash — auto-removed on flutter-first-frame -->
  <div id="loading-splash">
    <div class="brand">
      <div class="brand-icon">J</div>
      <span class="brand-text">JTK25</span>
    </div>
    <div class="spinner"></div>
    <p class="status">Memuat jadwal…</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove splash when Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) splash.remove();
    });
  </script>
</body>
</html>
