name: jtk25_client
description: "JTK25 Jadwal — Aplikasi jadwal perkuliahan JTK"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  workmanager: ^0.10.10
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  intl: ^0.20.3
  package_info_plus: ^8.1.3
  web: ^1.1.1
  json_schema: ^5.2.2
  google_fonts: ^6.3.2

dependency_overrides:
  # Pin to 3.10.0 — 3.11.0 uses isA<JSObject>() which requires Dart 3.12+
  # See: https://github.com/firebase/flutterfire/issues/18611
  firebase_core_web: 3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: false

flutter_native_splash:
  color: "#3B72D9"
  image: assets/icon/app_icon.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#3B72D9"
    image: assets/icon/app_icon.png
    icon_background_color: "#3B72D9"
